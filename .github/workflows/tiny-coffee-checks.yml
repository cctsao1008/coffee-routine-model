name: ☕ Tiny Coffee Checks

on:
  push:
  pull_request:

jobs:
  tiny-coffee-checks:
    name: 🐣 Make sure the tiny coffee world is happy
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Pick up the little repo basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 🐾 Gather tiny dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: 🐣 Check the particle nest
        run: python -m pytest -q
      - name: 🔍 Ask which clues can see the tiny states
        run: >-
          python -m tiny_tools.diagnose_observability
          --days 18
          --particles 120
          --seed 20260908
          --out .tiny-observability
      - name: 🌱 See whether a tiny wobble can find its way home
        run: >-
          python -m tiny_tools.measure_recovery
          --days 24
          --scenario slow-recovery
          --seed 20260908
          --out .tiny-recovery
      - name: 🔭 Let tomorrow lend yesterday a tiny hindsight hat
        run: >-
          python -m tiny_tools.compare_smoothing
          --days 24
          --particles 140
          --lag 6
          --scenario slow-recovery
          --seed 20260908
          --out .tiny-smoothing
      - name: 🧠 Watch one tiny memory reservoir build and rest
        run: >-
          python -m tiny_tools.inspect_memory
          --build-days 12
          --quiet-days 8
          --long-pause-days 16
          --out .tiny-memory
      - name: 🎛️ Ask whether the tiny probabilities keep their promises
        run: >-
          python -m tiny_tools.calibrate_observations
          --days 80
          --bins 5
          --scenario all
          --seed 20260908
          --out .tiny-calibration
      - name: ✂️ Ask whether one tiny world quietly became another
        run: >-
          python -m tiny_tools.detect_change_points
          --days 180
          --change-day 91
          --min-segment 24
          --before cozy-normal-year
          --after sleepy-reply-season
          --seed 20260908
          --out .tiny-change-point
      - name: 🌪️ Send the model on a tiny chaos picnic
        run: >-
          python -m tiny_tools.simulate
          --days 12
          --particles 300
          --scenario noisy-chaos-week
          --seed 20260908
          --out .tiny-ci-output
      - name: ☕✨ Make sure every little basket came home
        run: |
          test -f .tiny-ci-output/input.csv
          test -f .tiny-ci-output/output.csv
          test -f .tiny-ci-output/metrics.csv
          test -f .tiny-observability/scorecard.csv
          test -f .tiny-observability/clue-visibility.csv
          test -f .tiny-observability/state-identifiability.csv
          test -f .tiny-recovery/events.csv
          test -f .tiny-recovery/summary.csv
          test -f .tiny-recovery/recovery-story.png
          test -f .tiny-smoothing/comparison.csv
          test -f .tiny-smoothing/metrics.csv
          test -f .tiny-smoothing/hindsight.png
          test -f .tiny-memory/memory-story.csv
          test -f .tiny-memory/summary.csv
          test -f .tiny-memory/memory-story.png
          test -f .tiny-calibration/channel-summary.csv
          test -f .tiny-calibration/reliability.csv
          test -f .tiny-calibration/continuous-summary.csv
          test -f .tiny-calibration/scenario-summary.csv
          test -f .tiny-calibration/baseline-config.json
          test -f .tiny-change-point/boundary-score.csv
          test -f .tiny-change-point/summary.csv
          test -f .tiny-change-point/change-point.png
          echo "☕✨ All tiny checks are happy."
