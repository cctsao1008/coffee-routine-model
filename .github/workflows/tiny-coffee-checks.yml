name: ☕ Tiny Coffee Checks

on:
  push:
  pull_request:

jobs:
  tiny-coffee-checks:
    name: 🐣 Make sure the tiny coffee world is happy
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Pick up the little repo basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 🐾 Gather tiny dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: 🐣 Check the particle nest
        run: python -m pytest -q
      - name: 🔍 Ask which clues can see the tiny states
        run: >-
          python -m tiny_tools.diagnose_observability
          --days 18
          --particles 120
          --seed 20260908
          --out .tiny-observability
      - name: 🌱 See whether a tiny wobble can find its way home
        run: >-
          python -m tiny_tools.measure_recovery
          --days 24
          --scenario slow-recovery
          --seed 20260908
          --out .tiny-recovery
      - name: 🌪️ Send the model on a tiny chaos picnic
        run: >-
          python -m tiny_tools.simulate
          --days 12
          --particles 300
          --scenario noisy-chaos-week
          --seed 20260908
          --out .tiny-ci-output
      - name: ☕✨ Make sure every little basket came home
        run: |
          test -f .tiny-ci-output/input.csv
          test -f .tiny-ci-output/output.csv
          test -f .tiny-ci-output/metrics.csv
          test -f .tiny-observability/scorecard.csv
          test -f .tiny-observability/clue-visibility.csv
          test -f .tiny-observability/state-identifiability.csv
          test -f .tiny-recovery/events.csv
          test -f .tiny-recovery/summary.csv
          test -f .tiny-recovery/recovery-story.png
          echo "☕✨ All tiny checks are happy."
