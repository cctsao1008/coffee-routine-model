name: ☕ Tiny Coffee Checks

on:
  push:
  pull_request:

jobs:
  tiny-coffee-checks:
    name: 🐣 Make sure the tiny coffee world is happy
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Pick up the little repo basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 🐾 Gather tiny dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: 🐣 Check the particle nest
        run: python -m pytest -q
      - name: 🔍 Ask which clues can see the tiny states
        run: >-
          python -m tiny_tools.diagnose_observability
          --days 18
          --particles 120
          --seed 20260908
          --out .tiny-observability
      - name: 🌿 Give Voluntariness enough room to move
        run: >-
          python -m tiny_tools.excite_voluntariness
          --days 180
          --particles 1200
          --low-v 0.58
          --high-v 0.94
          --seed 20260908
          --out .tiny-v-excitation
      - name: 🌿🔬 Ask why the V posterior stays compressed
        run: >-
          python -m tiny_tools.diagnose_v_compression
          --days 180
          --particles 1200
          --low-v 0.58
          --high-v 0.94
          --seed 20260908
          --out .tiny-v-compression
      - name: 🌿🎛️ Scan bounded V dynamics priors
        run: >-
          python -m tiny_tools.scan_v_dynamics
          --days 180
          --particles 800
          --seeds 20260908,20260909,20260910
          --low-v 0.58
          --high-v 0.94
          --baseline-dir examples/365-cute-days
          --out .tiny-v-dynamics
      - name: 🧠🌱 Separate Shared Context shape from offset
        run: >-
          python -m tiny_tools.decompose_shared_context
          --baseline-dir examples/365-cute-days
          --particles 6000
          --seed 20260908
          --out .tiny-c-bias
      - name: 🧪 Poke clues and assumptions one tiny bit at a time
        run: >-
          python -m tiny_tools.map_sensitivity
          --days 36
          --particles 120
          --seed 20260908
          --out .tiny-sensitivity
      - name: 🪑 Ask whether every tiny state still earns its chair
        run: >-
          python -m tiny_tools.inspect_redundancy
          --scenario all
          --days 36
          --particles 120
          --seed 20260908
          --out .tiny-redundancy
      - name: 🌱 See whether a tiny wobble can find its way home
        run: >-
          python -m tiny_tools.measure_recovery
          --days 24
          --scenario slow-recovery
          --seed 20260908
          --out .tiny-recovery
      - name: 🔭 Let tomorrow lend yesterday a tiny hindsight hat
        run: >-
          python -m tiny_tools.compare_smoothing
          --days 24
          --particles 140
          --lag 6
          --scenario slow-recovery
          --seed 20260908
          --out .tiny-smoothing
      - name: 🧠 Watch one tiny memory reservoir build and rest
        run: >-
          python -m tiny_tools.inspect_memory
          --build-days 12
          --quiet-days 8
          --long-pause-days 16
          --out .tiny-memory
      - name: 🎛️ Ask whether the tiny probabilities keep their promises
        run: >-
          python -m tiny_tools.calibrate_observations
          --days 80
          --bins 5
          --scenario all
          --seed 20260908
          --out .tiny-calibration
      - name: ✂️ Ask whether one tiny world quietly became another
        run: >-
          python -m tiny_tools.detect_change_points
          --days 180
          --change-day 91
          --min-segment 24
          --before cozy-normal-year
          --after sleepy-reply-season
          --seed 20260908
          --out .tiny-change-point
      - name: 🌦️ Let fixed dice race context-aware dice
        run: >-
          python -m tiny_tools.compare_transitions
          --days 240
          --seed 20260908
          --out .tiny-transitions
      - name: 🌪️ Send the model on a tiny chaos picnic
        run: >-
          python -m tiny_tools.simulate
          --days 12
          --particles 300
          --scenario noisy-chaos-week
          --seed 20260908
          --out .tiny-ci-output
      - name: ☕✨ Make sure every little basket came home
        run: |
          test -f .tiny-ci-output/input.csv
          test -f .tiny-ci-output/output.csv
          test -f .tiny-ci-output/metrics.csv
          test -f .tiny-observability/scorecard.csv
          test -f .tiny-observability/clue-visibility.csv
          test -f .tiny-observability/state-identifiability.csv
          test -f .tiny-v-excitation/summary.csv
          test -f .tiny-v-excitation/v-track.csv
          test -f .tiny-v-excitation/channel-sensitivity.csv
          test -f .tiny-v-excitation/recipe.json
          test -f .tiny-v-excitation/v-excitation.png
          test -f .tiny-v-compression/filter-comparison.csv
          test -f .tiny-v-compression/likelihood-slice.csv
          test -f .tiny-v-compression/likelihood-summary.csv
          test -f .tiny-v-compression/dynamics-pressure.csv
          test -f .tiny-v-compression/recipe.json
          test -f .tiny-v-compression/v-compression.png
          test -f .tiny-v-dynamics/candidate-summary.csv
          test -f .tiny-v-dynamics/stress-runs.csv
          test -f .tiny-v-dynamics/baseline-guard.csv
          test -f .tiny-v-dynamics/recipe.json
          test -f .tiny-c-bias/prior-summary.csv
          test -f .tiny-c-bias/error-track.csv
          test -f .tiny-c-bias/time-bias.csv
          test -f .tiny-c-bias/mode-bias.csv
          test -f .tiny-c-bias/quiet-memory.csv
          test -f .tiny-c-bias/recipe.json
          test -f .tiny-c-bias/shared-context-bias.png
          test -f .tiny-sensitivity/sensitivity.csv
          test -f .tiny-sensitivity/summary.csv
          test -f .tiny-sensitivity/sensitivity-map.png
          test -f .tiny-redundancy/reconstruction-scorecard.csv
          test -f .tiny-redundancy/variant-scorecard.csv
          test -f .tiny-redundancy/posterior-correlation.csv
          test -f .tiny-redundancy/posterior-correlation.png
          test -f .tiny-redundancy/chair-summary.csv
          test -f .tiny-recovery/events.csv
          test -f .tiny-recovery/summary.csv
          test -f .tiny-recovery/recovery-story.png
          test -f .tiny-smoothing/comparison.csv
          test -f .tiny-smoothing/metrics.csv
          test -f .tiny-smoothing/hindsight.png
          test -f .tiny-memory/memory-story.csv
          test -f .tiny-memory/summary.csv
          test -f .tiny-memory/memory-story.png
          test -f .tiny-calibration/channel-summary.csv
          test -f .tiny-calibration/reliability.csv
          test -f .tiny-calibration/continuous-summary.csv
          test -f .tiny-calibration/scenario-summary.csv
          test -f .tiny-calibration/baseline-config.json
          test -f .tiny-change-point/boundary-score.csv
          test -f .tiny-change-point/summary.csv
          test -f .tiny-change-point/change-point.png
          test -f .tiny-transitions/transitions.csv
          test -f .tiny-transitions/summary.csv
          test -f .tiny-transitions/transition-race.png
          echo "☕✨ All tiny checks are happy."
