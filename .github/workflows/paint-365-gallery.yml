name: 🎨 Paint 365 Cute Days

on:
  push:
    paths:
      - .github/workflows/paint-365-gallery.yml
      - requirements.txt
      - tiny_tools/visualize.py
      - examples/365-cute-days/output.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint-the-coffee-wall:
    name: 🖼️☕ Hang one tiny coffee year on the wall
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Open the little repo basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 🎨 Gather the tiny paint brushes
        run: python -m pip install -r requirements.txt
      - name: 🐣 Make sure the 365-day model output is home
        run: test -f examples/365-cute-days/output.csv
      - name: 🖼️ Paint the tiny coffee gallery
        run: python -m tiny_tools.visualize examples/365-cute-days/output.csv
      - name: 🔎 Count all the little pictures
        run: |
          for state in P M V C E F; do
            test -f "examples/365-cute-days/state-${state}.png"
          done
          test -f examples/365-cute-days/modes.png
          test -f examples/365-cute-days/ess.png
          test -f examples/365-cute-days/tiny-year-summary.png
          echo "🎨☕ Every tiny picture found its frame."
      - name: 🐾 Hang the gallery back on main
        run: |
          git config user.name "tiny-coffee-painter"
          git config user.email "tiny-coffee-painter@users.noreply.github.com"
          git add examples/365-cute-days/*.png
          if git diff --cached --quiet; then
            echo "🖼️ The gallery already looks exactly right."
          else
            git commit -m "🎨☕ repaint the reproducible 365-day gallery"
            git push
          fi
