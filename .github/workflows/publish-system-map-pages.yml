name: 🗺️☕ Publish Interactive Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/diagrams/csrdm-from-routine-to-posterior.dataflow.json"
      - "tiny_tools/explore_posterior.py"
      - "examples/365-cute-days/input.csv"
      - "examples/365-cute-days/output.csv"
      - "pyproject.toml"
      - ".github/workflows/publish-system-map-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-interactive"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🐾 Give the interactive views some room
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🧺 Pick up the little repo basket
        uses: actions/checkout@v4

      - name: ☕ Warm up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🐍 Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📈 Gather the optional visualization spoon
        run: python -m pip install ".[viz]"

      - name: 🗺️ Fetch pinned Archify
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/archify.zip" \
            https://github.com/tt-a1i/archify/releases/download/v2.16.0/archify.zip
          echo "4c59fa6557a2385beaaef8c7219cc414573acc9f0c30a932d5053b0b20689a46  $RUNNER_TEMP/archify.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/archify-skill"
          unzip -q "$RUNNER_TEMP/archify.zip" -d "$RUNNER_TEMP/archify-skill"
          test -f "$RUNNER_TEMP/archify-skill/archify/bin/archify.mjs"

      - name: 🔍 Validate the authored map
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/archify-skill/archify/bin/archify.mjs" validate \
            dataflow \
            docs/diagrams/csrdm-from-routine-to-posterior.dataflow.json \
            --json \
            --quality showcase

      - name: ✨ Render the interactive system map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-site"
          node "$RUNNER_TEMP/archify-skill/archify/bin/archify.mjs" deliver \
            dataflow \
            docs/diagrams/csrdm-from-routine-to-posterior.dataflow.json \
            "$RUNNER_TEMP/pages-site/csrdm-from-routine-to-posterior.html" \
            --json \
            --quality showcase
          node "$RUNNER_TEMP/archify-skill/archify/bin/archify.mjs" check \
            "$RUNNER_TEMP/pages-site/csrdm-from-routine-to-posterior.html"

      - name: 📈 Render the interactive posterior explorer
        shell: bash
        run: |
          set -euo pipefail
          python -m tiny_tools.explore_posterior \
            examples/365-cute-days/output.csv \
            --events examples/365-cute-days/input.csv \
            --out "$RUNNER_TEMP/pages-site/posterior-explorer.html"
          test -s "$RUNNER_TEMP/pages-site/posterior-explorer.html"
          grep -q "CSRDM Posterior Explorer" "$RUNNER_TEMP/pages-site/posterior-explorer.html"
          touch "$RUNNER_TEMP/pages-site/.nojekyll"

      - name: 🏠 Add a tiny landing page
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/pages-site/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>CSRDM Interactive Views</title>
          </head>
          <body>
            <main>
              <h1>CSRDM Interactive Views ☕🐾</h1>
              <p><a href="csrdm-from-routine-to-posterior.html">Open the CSRDM interactive system map</a></p>
              <p><a href="posterior-explorer.html">Open the CSRDM posterior explorer</a></p>
              <p>Model the routine, not the person.</p>
            </main>
          </body>
          </html>
          EOF

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 🎁 Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: 🚀 Publish the interactive views
        id: deployment
        uses: actions/deploy-pages@v4
