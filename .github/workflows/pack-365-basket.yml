name: 🧺 Pack 365 Cute Days

on:
  push:
    paths:
      - .github/workflows/pack-365-basket.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-the-picnic-basket:
    name: 🗓️☕ Pack one tiny coffee year
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Open the little basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 🐣 Gather tiny dependencies
        run: python -m pip install -r requirements.txt
      - name: 🌱 Grow 365 cute synthetic days
        run: |
          python -m tiny_tools.simulate \
            --scenario cozy-normal-year \
            --days 365 \
            --particles 6000 \
            --seed 20260908
      - name: 🔎 Check that the picnic basket is really full
        run: |
          test -f examples/365-cute-days/input.csv
          test -f examples/365-cute-days/output.csv
          test -f examples/365-cute-days/metrics.csv
          test "$(($(wc -l < examples/365-cute-days/input.csv) - 1))" -eq 365
          test "$(($(wc -l < examples/365-cute-days/output.csv) - 1))" -eq 365
          echo "☕✨ 365 tiny days are all sitting nicely in the basket."
      - name: 🐾 Put the basket back on main
        run: |
          git config user.name "tiny-coffee-robot"
          git config user.email "tiny-coffee-robot@users.noreply.github.com"
          git add examples/365-cute-days/input.csv examples/365-cute-days/output.csv examples/365-cute-days/metrics.csv
          if git diff --cached --quiet; then
            echo "🌱 The basket already matches perfectly. Nothing to repack."
          else
            git commit -m "🗓️☕ pack 365 tiny days into the picnic basket"
            git push
          fi
