name: 🧺 Pack 365 Cute Days

on:
  push:
    paths:
      - .github/workflows/pack-365-basket.yml
      - requirements.txt
      - tiny_tools/audit_reference.py
      - tiny_tools/simulate.py
      - tiny_tools/visualize.py
      - coffee_brain/actions.py
      - coffee_brain/config.py
      - coffee_brain/memory.py
      - coffee_brain/model.py
      - coffee_brain/observation_model.py
      - coffee_brain/particles.py
      - coffee_brain/scenarios.py
  workflow_dispatch:

permissions:
  contents: write

# The reference basket and gallery are one generated transaction. Serializing all
# 365-reference writers avoids two tiny robots racing to put different frames on main. 🧺🎨
concurrency:
  group: coffee-routine-model-365-reference
  cancel-in-progress: false

jobs:
  pack-the-picnic-basket:
    name: 🗓️☕ Pack and paint one tiny coffee year
    runs-on: ubuntu-latest

    steps:
      - name: 🧺 Open the little basket
        uses: actions/checkout@v4
      - name: ☕ Warm up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 🐣 Gather tiny dependencies
        run: python -m pip install -r requirements.txt
      - name: 🌱 Grow 365 cute synthetic days
        run: |
          python -m tiny_tools.simulate \
            --scenario cozy-normal-year \
            --days 365 \
            --particles 6000 \
            --seed 20260908
      - name: 🔍 Measure what the reference actually excites
        run: |
          python -m tiny_tools.audit_reference examples/365-cute-days/output.csv
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("examples/365-cute-days/recipe.json")
          recipe = json.loads(path.read_text(encoding="utf-8"))
          recipe.update(
              {
                  "reference_scope": "observation-only baseline",
                  "action_schedule": "none",
                  "particle_filter_actions_supplied": False,
                  "controlled_transition_path_exercised": False,
                  "shared_context_action_accumulation_exercised": False,
              }
          )
          path.write_text(json.dumps(recipe, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("🔍☕ Reference scope recorded without changing the model behavior.")
          PY
      - name: 🎨 Paint the gallery from the same output
        run: python -m tiny_tools.visualize examples/365-cute-days/output.csv
      - name: 🧾 Save the exact little kitchen receipt
        run: |
          printf '%s\n' "$GITHUB_SHA" > examples/365-cute-days/source-revision.txt
          {
            python --version
            python -m pip freeze
          } > examples/365-cute-days/environment.txt
      - name: 🔎 Check that the picnic basket is coherent and full
        run: |
          test -f examples/365-cute-days/input.csv
          test -f examples/365-cute-days/output.csv
          test -f examples/365-cute-days/metrics.csv
          test -f examples/365-cute-days/state-excitation.csv
          test -f examples/365-cute-days/recipe.json
          test -f examples/365-cute-days/source-revision.txt
          test -f examples/365-cute-days/environment.txt
          test -f examples/365-cute-days/tiny-year-summary.png
          for state in P M V C E F; do
            test -f "examples/365-cute-days/state-${state}.png"
          done
          test -f examples/365-cute-days/modes.png
          test -f examples/365-cute-days/ess.png
          test "$(($(wc -l < examples/365-cute-days/input.csv) - 1))" -eq 365
          test "$(($(wc -l < examples/365-cute-days/output.csv) - 1))" -eq 365
          test "$(($(wc -l < examples/365-cute-days/state-excitation.csv) - 1))" -eq 6
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          rows = list(csv.DictReader(Path("examples/365-cute-days/input.csv").open(encoding="utf-8")))
          for row in rows:
              invite = int(row["invite"])
              opt_in = int(row["opt_in"])
              text_reply = int(row["text_reply"])
              maintenance = int(row["routine_maintenance"])
              pass_event = int(row["pass_event"])
              delay = row["response_delay_min"].strip()

              assert not (opt_in and pass_event), row["sample_id"]
              assert invite or not (opt_in or pass_event), row["sample_id"]
              assert text_reply or not (opt_in or pass_event), row["sample_id"]
              assert opt_in or not maintenance, row["sample_id"]
              assert bool(delay) == bool(text_reply), row["sample_id"]

          audit = list(csv.DictReader(Path("examples/365-cute-days/state-excitation.csv").open(encoding="utf-8")))
          assert [row["state"] for row in audit] == ["P", "M", "V", "C", "E", "F"]
          assert all(float(row["truth_span"]) >= 0.0 for row in audit)

          recipe = json.loads(Path("examples/365-cute-days/recipe.json").read_text(encoding="utf-8"))
          assert recipe["reference_scope"] == "observation-only baseline"
          assert recipe["action_schedule"] == "none"
          assert recipe["particle_filter_actions_supplied"] is False
          assert recipe["controlled_transition_path_exercised"] is False
          assert recipe["shared_context_action_accumulation_exercised"] is False

          print("☕🧭 The synthetic protocol grammar is coherent across all 365 days.")
          print("🔍🌱 The reference scope and state excitation receipt are explicit.")
          PY
          echo "☕✨ 365 tiny days and their gallery are sitting nicely in one basket."
      - name: 🐾 Put the basket back on main
        run: |
          git config user.name "tiny-coffee-robot"
          git config user.email "tiny-coffee-robot@users.noreply.github.com"
          git add \
            examples/365-cute-days/input.csv \
            examples/365-cute-days/output.csv \
            examples/365-cute-days/metrics.csv \
            examples/365-cute-days/state-excitation.csv \
            examples/365-cute-days/recipe.json \
            examples/365-cute-days/source-revision.txt \
            examples/365-cute-days/environment.txt \
            examples/365-cute-days/*.png
          if git diff --cached --quiet; then
            echo "🌱 The basket and gallery already match perfectly. Nothing to repack."
          else
            git commit -m "🗓️☕ repack the reference with an excitation receipt"
            git push
          fi
